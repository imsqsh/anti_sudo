[project]
name = "anti-sudo"
version = "0.1.0"
description = "OpenClaw agent that forwards zero2sudo Instagram job Stories to WhatsApp"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.50",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
